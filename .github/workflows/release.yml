# File: release.yml
# -----------------
# Layer: Build
# Description: Publishes a release for every version tag. When the repository's manifest.json names that version,
#              the release carries the Notion Importer plugin as Obsidian and Graphite install it: main.js (with the
#              WebAssembly module built with Embedded Swift inside it), manifest.json and styles.css.
#
# Authors: Bahey Shalash
# Version: 0.1
# Date: 27/11/2026

name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    container: swift:6.4.2-noble
    env:
      WEBASSEMBLY_SDK_URL: https://download.swift.org/swift-6.4.2-release/wasm-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_wasm.artifactbundle.tar.gz
      WEBASSEMBLY_SDK_CHECKSUM: 83baca83553f8c443cda7b84800912e6e709c3acd2e7ebf277794ca5836c0da5
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the GitHub command
        run: |
          apt-get update -qq && apt-get install -y -qq gh > /dev/null
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Does this version carry the plugin
        id: plugin
        run: |
          version="$(node -p 'require("./manifest.json").version' 2>/dev/null || true)"
          if [ "$version" = "$GITHUB_REF_NAME" ]; then echo "carries=yes" >> "$GITHUB_OUTPUT"; else echo "carries=no" >> "$GITHUB_OUTPUT"; fi
      - name: Build the plugin
        if: steps.plugin.outputs.carries == 'yes'
        run: |
          swift sdk install "$WEBASSEMBLY_SDK_URL" --checksum "$WEBASSEMBLY_SDK_CHECKSUM"
          Plugin/build-plugin.sh "$RUNNER_TEMP/plugin"
          node --check "$RUNNER_TEMP/plugin/main.js"
      - name: Publish the release
        run: |
          if [ "${{ steps.plugin.outputs.carries }}" = "yes" ]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
              "$RUNNER_TEMP/plugin/main.js" "$RUNNER_TEMP/plugin/manifest.json" "$RUNNER_TEMP/plugin/styles.css"
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
          fi
